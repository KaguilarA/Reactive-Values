name: Validate, publish, and deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    name: Test and build package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies and generate lockfile
        run: npm install

      - name: Verify lockfile
        shell: bash
        run: test -f package-lock.json

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

  publish:
    name: Publish to npm
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies and generate lockfile
        run: npm install

      - name: Verify lockfile
        shell: bash
        run: test -f package-lock.json

      - name: Build package
        run: npm run build

      - name: Select next patch version
        shell: bash
        run: |
          current_version=$(node -p 'require("./package.json").version')
          package_name=$(node -p 'require("./package.json").name')
          latest_version=$(npm view "$package_name" version 2>/dev/null || true)
          base_version="${latest_version:-$current_version}"

          npm version "$base_version" --no-git-tag-version --allow-same-version
          npm version patch --no-git-tag-version

          echo "Publishing version $(node -p 'require("./package.json").version')"

      - name: Update lockfile for published version
        run: npm install --package-lock-only

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-pages:
    name: Build GitHub Pages site
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies and generate lockfile
        run: npm install

      - name: Build demo
        run: npm run build-demo
        env:
          GITHUB_PAGES: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
